<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dlouhodobá predikce spotřeby</title>
<script>/*__PLOTLY__*/</script>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --surface-2: #f3f2ef; --border: #e1e0d9;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7;
  --series-1: #2a78d6; --series-2: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #242423; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #333331; --baseline: #52514e;
    --series-1: #3987e5; --series-2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --surface-2: #242423; --border: #383835;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #333331; --baseline: #52514e;
  --series-1: #3987e5; --series-2: #d95926;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
.sub { color: var(--text-secondary); margin: 0 0 20px; max-width: 900px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; }
.tile .k { color: var(--text-secondary); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 600; }
.tile .m { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.controls span { color: var(--text-secondary); font-size: 12px; margin-right: 4px; }
button { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--text-muted); }
button[aria-pressed="true"] { border-color: var(--text-primary); }
button:disabled { opacity: 0.4; cursor: default; }
.controls .window { margin-left: 8px; color: var(--text-primary); font-size: 13px; font-variant-numeric: tabular-nums; }
#chart { width: 100%; height: 560px; }
.legend { display: flex; gap: 6px; margin: 0 0 4px; flex-wrap: wrap; align-items: center; }
.legend > span { color: var(--text-secondary); font-size: 12px; margin-right: 4px; }
.legend button[aria-pressed="false"] { color: var(--text-muted); border-style: dashed; }
.legend button[aria-pressed="false"] i { opacity: 0.3; }
.legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }
.legend button { display: inline-flex; align-items: center; }
.legend i.band { height: 10px; opacity: 0.3; border-radius: 2px; }
@media (max-width: 800px) { #chart { height: 460px; } }
h2 { font-size: 15px; font-weight: 600; margin: 24px 0 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
.note { color: var(--text-muted); font-size: 12px; margin-top: 16px; max-width: 1000px; }
.wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Dlouhodobá predikce spotřeby</h1>
  <p class="sub" id="sub"></p>
  <div class="tiles" id="tiles"></div>
  <div class="controls" id="ranges"><span>Rozsah:</span></div>
  <div class="controls">
    <button type="button" id="prev" title="Posunout okno zpět o jeho šířku (šipka vlevo)">◀ Předchozí</button>
    <button type="button" id="next" title="Posunout okno vpřed o jeho šířku (šipka vpravo)">Další ▶</button>
    <button type="button" id="pan" aria-pressed="false" title="Tah myší posouvá okno místo přiblížení">Posun tahem</button>
    <span id="window" class="window"></span>
  </div>
  <div class="legend" id="legend"><span>Zobrazit:</span></div>
  <div id="chart"></div>
  <div class="wrap">
    <h2>Měsíční průměry</h2>
    <table id="monthly"><thead><tr id="mhead"></tr></thead><tbody></tbody></table>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
const D = /*__DATA__*/null;
const M = D.meta, BAND = D.lo !== null;
// siroky zaber kresli denni prumery (ctvrthodiny by splynuly v plochu), po
// priblizeni pod COARSE_DAYS dni ctvrthodinova data
const COARSE_DAYS = 45;
const fmt = (v, d = 1) => v === null || v === undefined ? "–"
  : v.toLocaleString("cs-CZ", { minimumFractionDigits: d, maximumFractionDigits: d });
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

const weatherText = M.pocasi === "scenare"
  ? `počasí ze ${M.scenaru} scénářů historických let (predikce = průměr scénářů)`
  : "normálové počasí (jedna dráha)";
const trendText = M.trend === "posledni" ? "pokračuje poslední trend" : M.trend === "drzet" ? "pomalé složky drží poslední hodnotu" : `trend: ${M.trend}`;
document.getElementById("sub").textContent =
  `Období ${M.od} až ${M.do} (${M.dni} dní), čtvrthodinový krok; ${weatherText}; ${trendText}.`;

const tiles = [
  ["Průměr za období", fmt(M.prumer), `posledních 365 dní dat: ${fmt(M.loni)} (${M.prumer >= M.loni ? "+" : "−"}${fmt(Math.abs(100 * (M.prumer / M.loni - 1)))} %)`],
  ["Maximum", fmt(M.max, 0), M.max_t],
  ["Minimum", fmt(M.min, 0), M.min_t],
];
if (BAND) tiles.push(["Průměrná šířka pásma", fmt(M.sirka), M.kvantily ? "10–90 % scénářů + chyba modelu" : "rozpětí scénářů + chyba modelu"]);
const tEl = document.getElementById("tiles");
for (const [k, v, m] of tiles) {
  const d = document.createElement("div"); d.className = "tile";
  const a = document.createElement("div"); a.className = "k"; a.textContent = k;
  const b = document.createElement("div"); b.className = "v"; b.textContent = v;
  const c = document.createElement("div"); c.className = "m"; c.textContent = m;
  d.append(a, b, c); tEl.append(d);
}

// mesicni tabulka (tabulkovy pohled na stejna data)
const cols = [["Měsíc", m => m.mesic + (m.dni < 27 ? ` (${fmt(m.dni, 0)} dní)` : "")], ["Predikce", m => fmt(m.predikce)]];
if (BAND) cols.push(["Pásmo dolní", m => fmt(m.pasmo_dolni)], ["Pásmo horní", m => fmt(m.pasmo_horni)]);
cols.push(["Báze", m => fmt(m.baze)], ["Topení", m => fmt(m.topeni)], ["Chlazení", m => fmt(m.chlazeni)], ["FVE", m => fmt(m.fve)],
  ["Skutečnost před rokem", m => fmt(m.loni)],
  ["Změna %", m => m.loni === null ? "–" : (m.predikce >= m.loni ? "+" : "−") + fmt(Math.abs(100 * (m.predikce / m.loni - 1)))]);
const hEl = document.getElementById("mhead");
for (const [name] of cols) { const th = document.createElement("th"); th.textContent = name; hEl.append(th); }
const tb = document.querySelector("#monthly tbody");
for (const m of D.monthly) {
  const tr = document.createElement("tr");
  for (const [, f] of cols) { const td = document.createElement("td"); td.textContent = f(m); tr.append(td); }
  tb.append(tr);
}

document.getElementById("note").textContent =
  "Model je odhadnutý ze všech dat; kalendář (typy dnů, svátky, mosty, Vánoce, průběh léta, osvětlení podle slunce) je pro budoucí dny daný. "
  + (M.pocasi === "scenare"
    ? `Každý scénář je skutečné počasí jednoho historického roku (i s posunem o 1–2 týdny), predikce je jejich průměr. Pásmo = ${M.kvantily ? "10–90 % scénářů" : "rozpětí scénářů"} rozšířené o chybu modelu a trendu při známém počasí (${fmt(M.model_sd, 0)} jednotek, z dopředné validace); v měsíční tabulce je pásmo měsíčních průměrů, proto je užší. V dopředné validaci pásmo pokrylo 71–81 % hodin (cíl 80 %) — z krátké historie počasí je spíš užší. `
    : "Normálová dráha je hladký průměr počasí podle dne v roce a času dne; chlazení, přechodná období a špičky podhodnocuje (model je nelineární), nejistotu neudává — k tomu slouží režim scénářů. ")
  + "Skutečnost před rokem je posunutá o 364 dní (stejný den v týdnu), v tabulce o 365 dní. "
  + `Při záběru nad ${COARSE_DAYS} dní se kreslí denní průměry (pásmo je průměr čtvrthodinového pásma), po přiblížení čtvrthodinové hodnoty. `
  + "Tahem myší přiblížíte (nebo s „Posun tahem“ posunete), dvojklik vrátí zvolený rozsah, ◀ / ▶ i šipky na klávesnici posunou okno o jeho šířku.";

// casy jsou mistni retezce "YYYY-MM-DD HH:MM"; samotne datum by Date bral jako UTC
const parse = s => new Date(s.length <= 10 ? s + "T00:00" : s.replace(" ", "T"));
const p2 = x => String(x).padStart(2, "0");
const fmtT = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmtT(d); };
const startX = D.t[0].slice(0, 10) + " 00:00";
const endX = addDays(D.t[D.t.length - 1].slice(0, 10) + " 00:00", 1);
const ranges = [["1 týden", 7], ["1 měsíc", 30], ["3 měsíce", 91], ["Celé období", null]];
let current = [startX, endX];   // vychozi okno (dvojklik se k nemu vraci)
let view = current.slice();
const spanDays = r => (parse(String(r[1])) - parse(String(r[0]))) / 864e5;
let coarse = spanDays(view) > COARSE_DAYS;
const src = () => coarse ? D.d : D;

let panMode = false;
function layout() {
  const ink = css("--text-secondary"), muted = css("--text-muted"), grid = css("--grid"), base = css("--baseline");
  const ax = { gridcolor: grid, linecolor: base, zerolinecolor: base, tickfont: { color: muted, size: 11 },
    title: { font: { color: ink, size: 12 } } };
  return {
    paper_bgcolor: css("--surface"), plot_bgcolor: css("--surface"),
    font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", color: css("--text-primary") },
    margin: { l: 56, r: 16, t: 8, b: 40 }, showlegend: false, hovermode: "x unified",
    hoverlabel: { bgcolor: css("--surface-2"), bordercolor: css("--border"), font: { color: css("--text-primary") } },
    dragmode: panMode ? "pan" : "zoom",
    xaxis: { ...ax, range: view, showspikes: true, spikemode: "across", spikethickness: 1,
      spikecolor: muted, spikedash: "solid", hoverformat: coarse ? "%d.%m.%Y (denní průměr)" : "%d.%m.%Y %H:%M",
      tickformatstops: [{ dtickrange: [null, 86400000], value: "%H:%M<br>%d.%m.%Y" },
                        { dtickrange: [86400000, null], value: "%d.%m.<br>%Y" }] },
    // osa y se dopocitava z viditelnych dat (fitY) — zoom i posun jen ve smeru x
    yaxis: { ...ax, title: { ...ax.title, text: "Spotřeba" }, fixedrange: true },
  };
}
// skupiny v legende: klic, popisek, barva, vychozi viditelnost, indexy trasovani
const GROUPS = [];
function traces() {
  const out = [], S = src();
  GROUPS.length = 0;
  if (BAND) {
    const fill = rgba(css("--series-1"), 0.22);
    // pasmo: dolni hrana + horni hrana s vyplni k predchozi; bez vlastniho radku v tooltipu
    out.push({ x: S.t, y: S.lo, type: "scatter", mode: "lines", line: { width: 0 }, hoverinfo: "skip" });
    out.push({ x: S.t, y: S.hi, type: "scatter", mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: fill, hoverinfo: "skip" });
    GROUPS.push(["band", "Pásmo nejistoty", "--series-1", true, [0, 1]]);
  }
  out.push({ x: S.t, y: S.h, name: "Skutečnost před rokem", type: "scatter", mode: "lines", connectgaps: false,
    line: { color: css("--series-2"), width: coarse ? 1.6 : 1.2 }, hovertemplate: "%{y:.1f}" });
  GROUPS.push(["h", "Skutečnost před rokem", "--series-2", false, [out.length - 1]]);
  // SVG (ne WebGL "scattergl"): WebGL nemusi byt v prohlizeci dostupny
  out.push({ x: S.t, y: S.p, name: "Predikce", type: "scatter", mode: "lines",
    customdata: BAND ? S.lo.map((v, i) => [v, S.hi[i]]) : undefined,
    line: { color: css("--series-1"), width: 2 },
    hovertemplate: BAND ? "%{y:.1f} (pásmo %{customdata[0]:.0f} až %{customdata[1]:.0f})" : "%{y:.1f}" });
  GROUPS.push(["p", "Predikce", "--series-1", true, [out.length - 1]]);
  GROUPS.forEach(g => g[4].forEach(i => { out[i].visible = vis[g[0]] ?? g[3]; }));
  return out;
}
const vis = {};
const el = document.getElementById("chart");
Plotly.newPlot(el, traces(), layout(), { responsive: true, displaylogo: false, locale: "cs",
  modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"], doubleClick: false });
GROUPS.forEach(g => { vis[g[0]] = g[3]; });

function fitY(a, b) {
  // osa y jen na viditelna data (autorange by bral cele obdobi)
  const arrs = [], S = src();
  if (vis.p) arrs.push(S.p);
  if (vis.h) arrs.push(S.h);
  if (BAND && vis.band) arrs.push(S.lo, S.hi);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < S.t.length; i++) {
    if (S.t[i] < a || S.t[i] > b) continue;
    for (const v of arrs) { if (v[i] === null) continue; lo = Math.min(lo, v[i]); hi = Math.max(hi, v[i]); }
  }
  if (lo < hi) { const p = (hi - lo) * 0.05; Plotly.relayout(el, { "yaxis.range": [lo - p, hi + p] }); }
}
function setRange(r) {
  current = r;
  Plotly.relayout(el, { "xaxis.range": r });
}
el.on("plotly_doubleclick", () => setRange(current));
el.on("plotly_relayout", ev => {
  let r = null;
  if (ev["xaxis.range[0]"]) r = [ev["xaxis.range[0]"], ev["xaxis.range[1]"]];
  else if (ev["xaxis.range"]) r = ev["xaxis.range"];
  else if (ev["xaxis.autorange"]) r = [startX, endX];
  if (!r) return;
  view = [String(r[0]), String(r[1])];
  if ((spanDays(view) > COARSE_DAYS) !== coarse) {
    coarse = !coarse;
    Plotly.react(el, traces(), layout());
  }
  fitY(view[0], view[1]);
  showWindow();
});

// posun okna o jeho vlastni sirku; cele dny se posouvaji kalendarne (zmena casu
// ma 23/25 h, posun v milisekundach by okno rozhodil o hodinu)
function shift(dir) {
  const a = parse(view[0]), b = parse(view[1]);
  const days = (b - a) / 864e5, whole = Math.round(days);
  let na, nb;
  if (whole >= 1 && Math.abs(days - whole) < 0.05) {
    na = parse(view[0]); na.setDate(na.getDate() + dir * whole);
    nb = parse(view[1]); nb.setDate(nb.getDate() + dir * whole);
  } else {
    na = new Date(+a + dir * (b - a)); nb = new Date(+b + dir * (b - a));
  }
  const lo = parse(startX), hi = parse(endX);
  if (nb > hi) { na = new Date(+hi - (b - a)); nb = hi; }
  if (na < lo) { na = lo; nb = new Date(+lo + (b - a)); }
  if (+na === +a) return;
  setRange([fmtT(na), fmtT(nb)]);
}
function showWindow() {
  const a = parse(view[0]), b = new Date(+parse(view[1]) - 1);
  const d = x => `${p2(x.getDate())}.${p2(x.getMonth() + 1)}.${x.getFullYear()}`;
  const t = x => `${p2(x.getHours())}:${p2(x.getMinutes())}`;
  const whole = a.getHours() === 0 && a.getMinutes() === 0 && b.getHours() === 23 && b.getMinutes() === 59;
  document.getElementById("window").textContent = (whole
    ? (d(a) === d(b) ? d(a) : `${d(a)} – ${d(b)}`)
    : `${d(a)} ${t(a)} – ${d(b)} ${t(new Date(+b + 1))}`) + (coarse ? " · denní průměry" : " · čtvrthodiny");
  document.getElementById("prev").disabled = a <= parse(startX);
  document.getElementById("next").disabled = +b + 1 >= +parse(endX);
}
document.getElementById("prev").onclick = () => shift(-1);
document.getElementById("next").onclick = () => shift(1);
const panBtn = document.getElementById("pan");
panBtn.onclick = () => {
  panMode = !panMode;
  panBtn.setAttribute("aria-pressed", String(panMode));
  Plotly.relayout(el, { dragmode: panMode ? "pan" : "zoom" });
};
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") { shift(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { shift(1); e.preventDefault(); }
});
const lEl = document.getElementById("legend");
// poradi v legende: predikce, pasmo, skutecnost pred rokem
for (const key of ["p", "band", "h"]) {
  const g = GROUPS.find(x => x[0] === key);
  if (!g) continue;
  const b = document.createElement("button"); b.type = "button";
  b.setAttribute("aria-pressed", String(vis[key]));
  const sw = document.createElement("i"); sw.style.background = `var(${g[2]})`;
  if (key === "band") sw.className = "band";
  b.append(sw, document.createTextNode(g[1]));
  b.onclick = () => {
    vis[key] = !vis[key]; b.setAttribute("aria-pressed", String(vis[key]));
    Plotly.restyle(el, { visible: vis[key] }, g[4]);
    fitY(view[0], view[1]);
  };
  lEl.append(b);
}
fitY(view[0], view[1]);
showWindow();

const rEl = document.getElementById("ranges");
const btns = [];
for (const [label, n] of ranges) {
  const b = document.createElement("button"); b.textContent = label; b.type = "button";
  b.setAttribute("aria-pressed", n === null ? "true" : "false");
  b.onclick = () => {
    btns.forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true");
    setRange(n ? [startX, addDays(startX, n)] : [startX, endX]);
  };
  btns.push(b); rEl.append(b);
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () =>
  Plotly.react(el, traces(), layout()));
</script>
</body>
</html>
